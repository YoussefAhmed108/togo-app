<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Figtree', 'Avenir Next', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #006873; } a:hover { color: #00838E; }
    /* The map is searched: a sweep turns, candidates blink up, one wins and drops. */
    @keyframes sweep { to { transform: rotate(360deg); } }
    @keyframes ripple { 0% { transform: scale(0.15); opacity: 0.6; } 100% { transform: scale(1); opacity: 0; } }
    @keyframes blink { 0%, 100% { transform: scale(0); opacity: 0; } 12% { transform: scale(1.2); opacity: 1; } 20%, 55% { transform: scale(1); opacity: 1; } 65% { transform: scale(0); opacity: 0; } }
    @keyframes win { 0%, 60% { transform: translateY(-50px) scale(0.5); opacity: 0; } 72% { transform: translateY(4px) scale(1.1); opacity: 1; } 78% { transform: translateY(-3px) scale(1); } 84%, 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes found { 0%, 76% { transform: translateY(10px); opacity: 0; } 86%, 100% { transform: translateY(0); opacity: 1; } }
    .cand { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: #FDFDFF; border: 3px solid #6A69DB; box-sizing: border-box; animation: blink 6s cubic-bezier(0.16,1,0.3,1) infinite; }
  </style>
</helmet>
<!-- C · Search the map: a radar sweep over the city; candidate spots blink up, the match drops in. -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F0F0F3; color: #1C1C25;">
  <div style="position: absolute; left: 12px; top: 56px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1C1C25" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </div>

  <div style="position: absolute; left: 45px; top: 130px; width: 300px; height: 300px; border-radius: 50%; overflow: hidden; background: #E6E7EC; box-shadow: 0 20px 50px rgba(20,20,30,0.14), inset 0 0 0 6px #FDFDFF;">
    <svg width="300" height="300" viewBox="0 0 300 300" style="position: absolute; inset: 0;">
      <path d="M120 -10 C95 80 170 130 140 210 C120 270 170 300 160 320 L195 320 C205 300 160 270 180 210 C210 130 135 80 160 -10 Z" fill="#CFE0EF"></path>
      <ellipse cx="235" cy="95" rx="40" ry="30" fill="#D6ECDD"></ellipse>
      <path d="M-10 70 L310 40 M-10 170 L310 150 M-10 250 L310 230 M60 -10 L90 310 M220 -10 L200 310" stroke="#FBFBFD" stroke-width="9" fill="none"></path>
    </svg>
    <!-- sweep -->
    <div style="position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, rgba(0,131,142,0) 0deg, rgba(0,131,142,0) 290deg, rgba(0,131,142,0.32) 360deg); animation: sweep 2s linear infinite;"></div>
    <!-- ripples from the centre -->
    <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #00838E; animation: ripple 2s ease-out infinite;"></div>
    <div style="position: absolute; inset: 0; border-radius: 50%; border: 2px solid #00838E; animation: ripple 2s ease-out 1s infinite;"></div>
    <!-- candidates -->
    <div class="cand" style="left: 82px; top: 96px; animation-delay: 0.2s;"></div>
    <div class="cand" style="left: 212px; top: 190px; animation-delay: 0.7s;"></div>
    <div class="cand" style="left: 110px; top: 222px; animation-delay: 1.1s;"></div>
    <div class="cand" style="left: 228px; top: 84px; animation-delay: 1.5s;"></div>
    <!-- the match -->
    <div style="position: absolute; left: 127px; top: 104px; animation: win 6s cubic-bezier(0.16,1,0.3,1) infinite;">
      <svg width="46" height="56" viewBox="0 0 24 30"><path d="M12 1c5 0 9 4 9 9 0 6.5-9 19-9 19S3 16.5 3 10c0-5 4-9 9-9z" fill="#00838E" stroke="#FFFFFF" stroke-width="1.4"></path><circle cx="12" cy="10" r="3.4" fill="#FFFFFF"></circle></svg>
    </div>
  </div>

  <div style="position: absolute; left: 95px; top: 404px; display: flex; align-items: center; gap: 8px; background: #FDFDFF; border-radius: 999px; padding: 8px 14px 8px 8px; box-shadow: 0 10px 26px rgba(20,20,30,0.14); animation: found 6s cubic-bezier(0.16,1,0.3,1) infinite;">
    <div style="width: 22px; height: 22px; border-radius: 50%; background: #00884B; display: flex; align-items: center; justify-content: center;">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"></path></svg>
    </div>
    <div style="font-size: 13px; font-weight: 700;">Found it — 3 branches nearby</div>
  </div>

  <div style="position: absolute; left: 32px; right: 32px; top: 500px; display: flex; flex-direction: column;">
    <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em;">Searching the map…</div>
    <div style="font-size: 13.5px; color: #5C5C69; margin-top: 6px;">Checking every spot that matches the video.</div>
    <div style="font-size: 12px; color: #5C5C69; margin-top: 24px;">This usually takes about 20 seconds.</div>
  </div>
</div>
</x-dc>
</body>
</html>
