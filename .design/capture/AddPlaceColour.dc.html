<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Figtree', 'Avenir Next', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #006873; } a:hover { color: #00838E; }
  </style>
</helmet>
<!-- E · Colour card: the name sits on a block coloured by its kind; tags are icon tiles you tap on and off. -->
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F0F0F3; color: #1C1C25;">
  <div style="position: absolute; left: 0; right: 0; top: 54px; display: flex; align-items: center; padding: 0 12px;">
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center;">
      <svg width="12" height="18" viewBox="0 0 10 16" fill="none"><path d="M8 1L2 8l6 7" stroke="#1C1C25" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </div>
    <div style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 800;">Add a place</div>
    <div style="width: 44px;"></div>
  </div>

  <!-- the name on its colour block, with a small map inset -->
  <div style="position: absolute; left: 16px; right: 16px; top: 108px; border-radius: 22px; background: #E65719; padding: 18px; display: flex; gap: 14px; box-shadow: 0 16px 36px rgba(230,87,25,0.28);">
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: rgba(255,255,255,0.8);">Food &amp; drink</div>
      <div style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; color: #FFFFFF;">Koshary Abou Tarek</div>
      <div style="font-size: 12.5px; color: rgba(255,255,255,0.85);">16 Champollion St, Downtown</div>
      <div style="display: flex; gap: 6px; margin-top: 4px;">
        <div style="font-size: 11.5px; font-weight: 700; color: #FFFFFF; background: rgba(255,255,255,0.22); border-radius: 999px; padding: 4px 10px;">restaurant</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #FFFFFF; background: rgba(255,255,255,0.22); border-radius: 999px; padding: 4px 10px;">egyptian</div>
      </div>
    </div>
    <div style="position: relative; width: 92px; height: 120px; flex-shrink: 0; border-radius: 14px; overflow: hidden; background: #E6E7EC; box-shadow: 0 0 0 3px rgba(255,255,255,0.35);">
      <svg width="92" height="120" viewBox="0 0 92 120" style="position: absolute; inset: 0;">
        <path d="M30 -5 C22 40 52 60 42 125 L58 125 C66 60 38 40 46 -5 Z" fill="#CFE0EF"></path>
        <path d="M-5 38 L97 30 M-5 82 L97 72 M22 -5 L30 125 M72 -5 L66 125" stroke="#FBFBFD" stroke-width="6" fill="none"></path>
      </svg>
      <div style="position: absolute; left: 34px; top: 38px;">
        <svg width="24" height="30" viewBox="0 0 24 30"><path d="M12 1c5 0 9 4 9 9 0 6.5-9 19-9 19S3 16.5 3 10c0-5 4-9 9-9z" fill="#E65719" stroke="#FFFFFF" stroke-width="1.6"></path><circle cx="12" cy="10" r="3.4" fill="#FFFFFF"></circle></svg>
      </div>
    </div>
  </div>

  <!-- tags as tiles -->
  <div style="position: absolute; left: 16px; right: 16px; top: 330px; display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 15px; font-weight: 800;">Tag it</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="position: relative; height: 84px; border-radius: 16px; background: #FFE7DC; border: 2px solid #E65719; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10"></path><path d="M17 21V3c-2 1.5-3 4-3 7h3"></path></svg>
        <div style="font-size: 12.5px; font-weight: 700; color: #9A3412;">restaurant</div>
        <div style="position: absolute; top: 7px; right: 7px; width: 18px; height: 18px; border-radius: 50%; background: #E65719; display: flex; align-items: center; justify-content: center;"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"></path></svg></div>
      </div>
      <div style="height: 84px; border-radius: 16px; background: #FDFDFF; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E65719" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"></path><path d="M16 11h1.5a2.5 2.5 0 0 1 0 5H16"></path><path d="M8 3v3M12 3v3"></path></svg>
        <div style="font-size: 12.5px; font-weight: 600;">cafe</div>
      </div>
      <div style="height: 84px; border-radius: 16px; background: #FDFDFF; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E65719" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8l-1 7a3 3 0 0 1-6 0z"></path><path d="M12 13v8M8 21h8"></path></svg>
        <div style="font-size: 12.5px; font-weight: 600;">bar</div>
      </div>
      <div style="height: 84px; border-radius: 16px; background: #FDFDFF; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E9E52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l6 9h-3l4 6H5l4-6H6z"></path><path d="M12 18v3"></path></svg>
        <div style="font-size: 12.5px; font-weight: 600;">park</div>
      </div>
      <div style="height: 84px; border-radius: 16px; background: #FDFDFF; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E9E52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V10l8-6 8 6v11"></path><path d="M9 21v-6h6v6"></path></svg>
        <div style="font-size: 12.5px; font-weight: 600;">rooftop</div>
      </div>
      <div style="height: 84px; border-radius: 16px; background: #FDFDFF; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6A69DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5"></path><path d="M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 21h18"></path></svg>
        <div style="font-size: 12.5px; font-weight: 600;">museum</div>
      </div>
      <div style="height: 84px; border-radius: 16px; background: #FDFDFF; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6A69DB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"></circle><circle cx="9" cy="9" r="1.2"></circle><circle cx="14.5" cy="8.5" r="1.2"></circle><circle cx="16" cy="13" r="1.2"></circle><path d="M11 16.5a2 2 0 0 1-2-2"></path></svg>
        <div style="font-size: 12.5px; font-weight: 600;">art</div>
      </div>
      <div style="height: 84px; border-radius: 16px; background: #FDFDFF; border: 2px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#DB5392" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1 13H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
        <div style="font-size: 12.5px; font-weight: 600;">shopping</div>
      </div>
      <div style="height: 84px; border-radius: 16px; border: 2px dashed #BABAC1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 7px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#5C5C69" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
        <div style="font-size: 12.5px; font-weight: 600; color: #5C5C69;">Your own</div>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 16px 30px; background: #FDFDFF; border-top: 1px solid #DCDCE0;">
    <div style="min-height: 48px; border-radius: 14px; background: #00838E; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Next — choose destination</div>
  </div>
</div>
</x-dc>
</body>
</html>
