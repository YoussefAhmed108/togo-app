<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Figtree', 'Avenir Next', 'Helvetica Neue', sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #006873; } a:hover { color: #00838E; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F0F0F3; color: #1C1C25;">

  <!-- Brand -->
  <div style="position: absolute; left: 24px; top: 64px; display: flex; align-items: center; gap: 9px;">
    <div style="position: relative; width: 30px; height: 30px; border-radius: 9px; background: #009FAA;">
      <div style="position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; border-radius: 50%; background: #6F6FE2; border: 2px solid #F0F0F3;"></div>
    </div>
    <div style="font-size: 19px; font-weight: 800; letter-spacing: -0.01em;">Waypoint</div>
  </div>

  <!-- The mechanism, shown: video → place → space -->
  <div style="position: absolute; left: 42px; top: 128px; width: 132px; height: 212px; border-radius: 18px; background: #1C1C25; transform: rotate(-7deg); box-shadow: 0 18px 40px rgba(20,20,30,0.22); overflow: hidden;">
    <div style="position: absolute; inset: 0; background: repeating-linear-gradient(45deg, #26263A, #26263A 8px, #2E2E44 8px, #2E2E44 16px);"></div>
    <div style="position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center;">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M8 5.5v13l10-6.5z" fill="#FFFFFF"></path></svg>
    </div>
    <div style="position: absolute; right: 10px; bottom: 12px; width: 32px; height: 32px; border-radius: 50%; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1C25" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"></path><path d="M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"></path></svg>
    </div>
  </div>

  <div style="position: absolute; left: 150px; top: 196px; width: 206px; background: #FDFDFF; border-radius: 16px; padding: 12px; box-sizing: border-box; box-shadow: 0 18px 44px rgba(20,20,30,0.14); display: flex; flex-direction: column; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="width: 38px; height: 38px; border-radius: 11px; background: #00838E; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"></path><circle cx="12" cy="10" r="2.3"></circle></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
        <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #006873;">Found it</div>
        <div style="font-size: 14px; font-weight: 700;">[Place name]</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; background: #DBDBFF; border-radius: 10px; padding: 7px 10px;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4E4DB8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 19.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"></path><path d="M16 5.6a3.2 3.2 0 0 1 0 5.8M17.5 14.9c2 .5 3.5 2.1 3.5 4.6"></path></svg>
      <div style="font-size: 12px; font-weight: 600; color: #3B3A8F;">Added to [Space name]</div>
    </div>
  </div>

  <!-- Form -->
  <div style="position: absolute; left: 24px; right: 24px; top: 400px; display: flex; flex-direction: column;">
    <div style="font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;">Saw it on TikTok?<br>Keep it.</div>
    <div style="font-size: 14px; color: #5C5C69; margin-top: 8px; text-wrap: pretty;">Share any video to Waypoint and we'll find the place for you.</div>
    <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 24px;">
      <div style="height: 50px; box-sizing: border-box; background: #FDFDFF; border: 1px solid #DCDCE0; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; font-size: 14px; color: #5C5C69;">you@email.com</div>
      <div style="height: 50px; box-sizing: border-box; background: #FDFDFF; border: 1px solid #DCDCE0; border-radius: 12px; padding: 0 14px; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #5C5C69;">
        <span>Password</span><span style="font-size: 13px; font-weight: 700; color: #006873;">Show</span>
      </div>
    </div>
    <div style="margin-top: 18px; min-height: 48px; border-radius: 14px; background: #00838E; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Sign in</div>
    <div style="display: flex; justify-content: center; gap: 5px; margin-top: 20px; font-size: 13px; color: #5C5C69;">
      <span>Don't have an account?</span><span style="font-weight: 700; color: #00838E;">Create one</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
