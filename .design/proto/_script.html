      },
      analyseProgress: ((s.analyseStep + 1) / 3 * 100) + '%',
      analyseStages: [T.stage1, T.stage2, T.stage3].map((label, i) => ({
        label,
        done: i < s.analyseStep,
        cls: i < s.analyseStep ? 'stageDone' : (i === s.analyseStep ? 'stageOn stageBusy' : ''),
      })),
      candidates: CANDIDATES.map(c => ({
        name: c.name, address: c.address,
        pick: () => this.setState({ picked: { name: c.name, address: c.address, gid: c.gid }, showCandidates: false }),
      })),
      dismissCandidates: () => this.setState({ showCandidates: false }),
      hasTags: s.addTags.length > 0,
      chosenTags: s.addTags.map(t => ({
        label: t,
        remove: () => this.setState({ addTags: s.addTags.filter(x => x !== t) }),
      })),
      hasSpaceTags: !!s.addScopeSpace,
      spaceTagSuggestions: SPACE_TAGS.filter(t => s.addTags.indexOf(t) < 0).map(t => ({
        label: t,
        add: () => this.addTag(t),
      })),
      tagSuggestions: GLOBAL_TAGS.filter(t => s.addTags.indexOf(t) < 0).slice(0, 12).map(t => ({
        label: (TAG_EMOJI[t] || '🏷️') + ' ' + t,
        add: () => this.addTag(t),
      })),
      goDestinations: () => { if (s.picked) this.setState({ addStep: 'destinations' }); },
      backToForm: () => this.setState({ addStep: 'form' }),
      destinations: [{ id: 'saved', emoji: '📍', label: T.savedPlaces }].concat(
        SPACES.map(sp => ({ id: sp.id, emoji: '🗂️', label: sp.name }))
      ).map(d => {
        const on = d.id === 'saved' ? s.destSaved : !!s.destSpaces[d.id];
        return {
          emoji: d.emoji, label: d.label,
          on: on,
          boxBorder: on ? A1 : 'var(--ringIdle)',
          boxBg: on ? A1 : 'transparent',
          toggle: d.id === 'saved'
            ? (() => this.setState({ destSaved: !s.destSaved }))
            : (() => this.toggleKey('destSpaces', d.id)),
        };
      }),
      destCta: destCount === 0 ? T.pickAtLeastOne : (T.saveTo + ' ' + destCount + ' ' + (destCount === 1 ? T.destination : T.destinations)),
      destDisabled: destCount === 0 ? 'true' : 'false',
      saveWithDestinations: () => { if (destCount > 0) this.setState({ addStep: 'success' }); },
      successSub: destCount === 1 ? 'It is now in one destination and can be added to any space.' : ('It is now in ' + destCount + ' destinations.'),
      successEmoji: successEmoji,

      dir: s.lang === 'ar' ? 'rtl' : 'ltr',
      t: T,
      segEn: s.lang === 'ar' ? '' : 'segOn',
      segAr: s.lang === 'ar' ? 'segOn' : '',
      setEn: () => this.setState({ lang: 'en' }),
      setAr: () => this.setState({ lang: 'ar' }),

      pointsOpen: s.pointsOpen,
      pointsCaret: s.pointsOpen ? '180deg' : '0deg',
      pointsSummary: s.points.length === 0 ? T.noneYet : (s.points.length + ' ' + (s.points.length === 1 ? T.address1 : T.addressN)),
      togglePoints: () => this.setState({ pointsOpen: !s.pointsOpen }),
      hasPoints: s.points.length > 0,
      noPoints: s.points.length === 0,
      points: s.points.map(p => ({
        label: p.label,
        address: p.address,
        remove: () => this.setState({ points: s.points.filter(x => x.id !== p.id) }),
        use: () => this.setState({ location: p.label, sheet: null }),
      })),
      openAddPoint: () => this.openSheet('point'),
      openPassword: () => this.openSheet('password'),
      sheetPoint: s.sheet === 'point',
      sheetPassword: s.sheet === 'password',
      openSettings: () => this.openSheet('settings'),
      sheetSettings: s.sheet === 'settings',
      settingsSummary: (s.dark ? T.dark : T.light) + ' · ' + (s.lang === 'ar' ? 'العربية' : 'English'),
      sheetReview: s.sheet === 'review' && !!s.review,
      reviewPlace: s.review ? ((PLACES.find(p => p.id === s.review.id) || {}).name || '') : '',
      reviewStars: [1, 2, 3, 4, 5].map(n => ({
        cls: s.review && s.review.stars >= n ? 'on' : '',
        checked: s.review && s.review.stars === n ? 'true' : 'false',
        label: n + ' / 5',
        pick: () => this.setReview({ stars: n }),
      })),
      reviewNoteText: s.review && s.review.noted ? T.reviewSample : T.reviewNotePh,
      reviewNoteFg: s.review && s.review.noted ? 'var(--text)' : 'var(--muted)',
      reviewFillNote: () => this.setReview({ noted: true }),
      reviewPhotoList: s.review ? Array.from({ length: s.review.photos }, (_, i) => ({ i })) : [],
      reviewAddPhoto: () => this.setReview({ photos: Math.min(4, ((this.state.review || {}).photos || 0) + 1) }),
      reviewDisabled: s.review && s.review.stars ? 'false' : 'true',
      reviewSave: () => { if (this.state.review && this.state.review.stars) this.closeSheet(); },
      passwordAge: T.passwordAge,
      csConfig: s.cs === 'config' || s.cs === 'creating',
      csDone: s.cs === 'done',
      csClose: () => this.setState({ cs: null }),
      csNoPhoto: !s.csPhoto,
      csHasPhoto: s.csPhoto,
      csBannerCls: s.csPhoto ? 'csBannerFilled' : '',
      csPickPhoto: () => this.setState({ csPhoto: true }),
      csIcon: s.csIcon,
      csAccent: csAccent,
      csAccentSoft: 'color-mix(in oklab, ' + csAccent + ' 20%, var(--rowBg))',
      csNameText: s.csNamed ? T.csSampleName : T.csNamePh,
      csNameFg: s.csNamed ? 'var(--text)' : 'var(--muted)',
      csNameCount: (s.csNamed ? T.csSampleName.length : 0) + '/60',
      csFillName: () => this.setState({ csNamed: true }),
      csGridLabel: s.csPhoto ? T.csBadgeIcon : T.csIconLbl,
      csEmojis: CS_EMOJIS.map(e => ({
        emoji: e,
        cls: e === s.csIcon ? 'csEmojiOn' : '',
        pick: () => this.setState({ csIcon: e }),
      })),
      csHasHint: !!csHint,
      csHint: csHint,
      csDisabled: csValid && s.cs !== 'creating' ? 'false' : 'true',
      csBusy: s.cs === 'creating',
      csBtnLabel: s.cs === 'creating' ? T.csCreating : T.createSpace,
      csCreate: () => {
        if (!csValid || s.cs === 'creating') return;
        this.setState({ cs: 'creating' });
        setTimeout(() => this.setState({ cs: 'done', csCopied: false }), 900);
      },
      csDonePhoto: s.csPhoto,
      csDoneEmoji: !s.csPhoto,
      csLink: CS_LINK,
      csCopied: s.csCopied,
      csCopyHint: s.csCopied ? T.csCopied : T.csTapCopy,
      csCopyFg: s.csCopied ? 'var(--okFill)' : 'var(--a1Text)',
      csCopyLabel: s.csCopied ? T.csCopied : T.csCopyLink,
      csCopy: () => {
        this.setState({ csCopied: true });
        clearTimeout(this.csCopyTimer);
        this.csCopyTimer = setTimeout(() => this.setState({ csCopied: false }), 2500);
      },
      csFinish: () => this.setState({ cs: null, tab: 'home', stack: [] }),

      tabHome: tabVals('home', T.home),
      tabMap: tabVals('map', T.map),
      tabSpaces: tabVals('spaces', T.spaces),
      tabProfile: tabVals('profile', T.profile),
    };
  }
}
</script>
