# fly.toml app configuration file generated for togo-app on 2026-08-29T09:52:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'togo-app'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
